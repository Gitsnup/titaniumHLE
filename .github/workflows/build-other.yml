name: Build TitaniumHLE (Other Platforms)

# Builds for platforms that don't get their own dedicated workflow:
#
# * AArch64 Linux, cross-compiled from an x86_64 Linux runner using the distro
#   aarch64 toolchain (gcc-aarch64-linux-gnu). The vendored dependencies
#   (SDL2, dynarmic, openal-soft) all build from source against the cross
#   toolchain, so the only aarch64-specific things needed from apt are the
#   runtime libraries that the final binary dynamically links (ALSA, X11,
#   Wayland); their development headers are architecture-independent.
# * AArch64 Windows, built natively on GitHub's free windows-11-arm hosted
#   runner with the MSVC toolchain (aarch64-pc-windows-msvc). Cross-compiling
#   this target from Linux doesn't work: corosensei refuses to compile for
#   aarch64-pc-windows-gnullvm, so a native runner it is.

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  create: # for tags
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-aarch64:
    runs-on: ubuntu-24.04

    steps:
    # actions/checkout really doesn't work well with git-describe for some
    # reason (most likely it strips the annotation off the tag somehow).
    - name: Checkout TitaniumHLE
      run: |
        mkdir -p "$GITHUB_WORKSPACE"
        git clone https://github.com/gitsnup/titaniumHLE "$GITHUB_WORKSPACE"
        cd "$GITHUB_WORKSPACE"
        git fetch origin "$GITHUB_REF"
        git checkout "$GITHUB_SHA" # avoid race condition if branch/tag changes
    - name: Get Submodules
      run: git submodule update --init
    - name: Try to get cached copy of Boost
      id: cache-boost
      uses: actions/cache@v3
      with:
        path: vendor/boost
        key: boost_1_81_0
    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
      name: Download Boost
      run: curl -L -o boost_1_81_0.tar.gz "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"
    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
      name: Extract Boost
      run: tar xzvf boost_1_81_0.tar.gz -C vendor && mv vendor/boost_1_81_0 vendor/boost
    # dynarmic needs Boost headers, which are architecture-independent, but
    # CMake can't find them through the cross sysroot, so vendor them (same as
    # the Android and Haiku workflows do).
    # aarch64 packages on Ubuntu come from ports.ubuntu.com, which is not in
    # the default apt sources of an x86_64 runner, so set up multiarch first.
    - name: Enable aarch64 multiarch apt packages
      run: |
        sudo dpkg --add-architecture arm64
        sudo cp /etc/apt/sources.list.d/ubuntu.sources /tmp/ubuntu.sources
        sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /tmp/ubuntu.sources
        cat <<'EOF' | sudo tee -a /tmp/ubuntu.sources > /dev/null

        Types: deb
        Architectures: arm64
        URIs: http://ports.ubuntu.com/ubuntu-ports
        Suites: noble noble-updates noble-security
        Components: main restricted universe multiverse
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        EOF
        sudo mv /tmp/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources
        sudo apt-get update
    - name: Install aarch64 toolchain and libraries
      run: |
        sudo apt-get install -y --no-install-recommends \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          libasound2-dev:arm64 \
          libx11-dev:arm64 libxext-dev:arm64 libxrandr-dev:arm64 \
          libxrender-dev:arm64 libxfixes-dev:arm64 libxi-dev:arm64 \
          libxss-dev:arm64 libxcursor-dev:arm64 libxkbcommon-dev:arm64 \
          libwayland-dev:arm64 libxkbcommon-x11-dev:arm64
    - name: Install aarch64 Rust toolchain
      run: |
        rustup update stable
        rustup default stable
        rustup target add aarch64-unknown-linux-gnu
    # Without this, CMake (used by SDL2, dynarmic and openal-soft) probes the
    # x86_64 host and picks up host libraries and flags. FIND_ROOT_PATH must
    # include /usr so that CMake can find the multiarch-installed aarch64
    # libraries under /usr/lib/aarch64-linux-gnu.
    - name: Write CMake toolchain file
      run: |
        cat > aarch64-toolchain.cmake <<'EOF'
        set(CMAKE_SYSTEM_NAME Linux)
        set(CMAKE_SYSTEM_PROCESSOR aarch64)
        set(CMAKE_C_COMPILER /usr/bin/aarch64-linux-gnu-gcc)
        set(CMAKE_CXX_COMPILER /usr/bin/aarch64-linux-gnu-g++)
        set(CMAKE_FIND_ROOT_PATH /usr/aarch64-linux-gnu /usr)
        set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
        set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY BOTH)
        set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE BOTH)
        set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE BOTH)
        EOF
    # The tests can't run because the built binary is aarch64 and the runner
    # is x86_64.
    - name: Build
      env:
        CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        SDL2_TOOLCHAIN: ${{ github.workspace }}/aarch64-toolchain.cmake
        CMAKE_TOOLCHAIN_FILE_aarch64_unknown_linux_gnu: ${{ github.workspace }}/aarch64-toolchain.cmake
        PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        PKG_CONFIG_ALLOW_CROSS: "1"
      run: cargo build --target aarch64-unknown-linux-gnu --release
    - name: Package binary
      run: |
        cd target/aarch64-unknown-linux-gnu/release
        tar czvf ../../../touchHLE_aarch64-unknown-linux-gnu.tar.gz touchHLE
    - uses: actions/upload-artifact@v4
      with:
        name: touchHLE_Linux_aarch64
        path: touchHLE_aarch64-unknown-linux-gnu.tar.gz

